<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titleInventory">库存管理 - 血液与骨髓捐献管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard" data-i18n="brand">🩸 捐献管理系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item dropdown language-switcher me-2">
                        <button class="btn btn-light btn-sm dropdown-toggle" id="languageDropdown"
                            data-bs-toggle="dropdown">
                            🌐 <span data-i18n="langLabel" data-current-lang-label>中文</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item lang-option" data-lang="zh" data-i18n="langChinese">中文</a></li>
                            <li><a class="dropdown-item lang-option" data-lang="en" data-i18n="langEnglish">英文</a></li>
                            <li><a class="dropdown-item lang-option" data-lang="ru" data-i18n="langRussian">俄语</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <span id="currentUser">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn" data-i18n="logout">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/dashboard" data-i18n="navDashboard">📊 仪表板</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="/donors" data-i18n="navDonors">👥 捐献者管理</a></li>
                        <li class="nav-item"><a class="nav-link" href="/medical-checks" data-i18n="navMedicalChecks">🏥
                                体检记录</a></li>
                        <li class="nav-item"><a class="nav-link" href="/donations" data-i18n="navDonations">💉 捐献记录</a>
                        </li>
                        <li class="nav-item"><a class="nav-link active" href="/inventory" data-i18n="navInventory">📦
                                库存管理</a></li>
                        <li class="nav-item"><a class="nav-link" href="/appointments" data-i18n="navAppointments">📅
                                预约管理</a></li>
                        <li class="nav-item"><a class="nav-link" href="/reports" data-i18n="navReports">📈 统计报表</a></li>
                        <li class="nav-item"><a class="nav-link" href="/users" data-i18n="navUsers">⚙️ 用户管理</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="pt-3 pb-2 mb-3 border-bottom">
                    <h2 data-i18n="headingInventory">库存管理</h2>
                </div>

                <div class="content-card mb-4">
                    <div class="page-toolbar">
                        <div class="filter-grid">
                            <div>
                                <label class="form-label visually-hidden" for="bloodTypeFilter"
                                    data-i18n="invFilterBloodLabel">血型筛选</label>
                                <select class="form-select" id="bloodTypeFilter">
                                    <option value="" data-i18n="optionAllBloodTypes">全部血型</option>
                                    <option value="I_POSITIVE">I+</option>
                                    <option value="I_NEGATIVE">I-</option>
                                    <option value="II_POSITIVE">II+</option>
                                    <option value="II_NEGATIVE">II-</option>
                                    <option value="III_POSITIVE">III+</option>
                                    <option value="III_NEGATIVE">III-</option>
                                    <option value="IV_POSITIVE">IV+</option>
                                    <option value="IV_NEGATIVE">IV-</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label visually-hidden" for="typeFilter"
                                    data-i18n="invFilterTypeLabel">类型筛选</label>
                                <select class="form-select" id="typeFilter">
                                    <option value="" data-i18n="optionPleaseSelect">请选择</option>
                                    <option value="WHOLE_BLOOD" data-i18n="invTypeWholeBlood">全血</option>
                                    <option value="PLASMA" data-i18n="invTypePlasma">血浆</option>
                                    <option value="PLATELETS" data-i18n="invTypePlatelets">血小板</option>
                                    <option value="BONE_MARROW_SAMPLE" data-i18n="invTypeBoneMarrow">骨髓样本</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label visually-hidden" for="statusFilter"
                                    data-i18n="invFilterStatusLabel">状态筛选</label>
                                <select class="form-select" id="statusFilter">
                                    <option value="" data-i18n="optionAllStatus">全部状态</option>
                                    <option value="IN_STOCK" data-i18n="invStatusInStock">在库</option>
                                    <option value="RESERVED" data-i18n="invStatusReserved">已预留</option>
                                    <option value="USED" data-i18n="invStatusUsed">已使用</option>
                                    <option value="EXPIRED" data-i18n="invStatusExpired">已过期</option>
                                    <option value="DISCARDED" data-i18n="invStatusDiscarded">已废弃</option>
                                </select>
                            </div>
                            <div>
                                <input type="date" class="form-control" id="expiryFilter" placeholder="过期日期前"
                                    data-i18n-placeholder="invFilterExpiryPlaceholder">
                            </div>
                        </div>
                        <div class="action-row">
                            <button class="btn btn-outline-primary" type="button" id="searchBtn">
                                <span class="me-1">🔍</span><span data-i18n="invButtonSearch">搜索</span>
                            </button>
                            <button class="btn btn-primary add-record-btn" data-bs-toggle="modal"
                                data-bs-target="#inventoryModal" onclick="openAddModal()">
                                <span class="icon-dot">＋</span>
                                <span class="label" data-i18n="invButtonAdd">添加库存</span>
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th data-i18n="invTableId">ID</th>
                                    <th data-i18n="invTableType">类型</th>
                                    <th data-i18n="invTableBlood">血型</th>
                                    <th data-i18n="invTableCollected">采集日期</th>
                                    <th data-i18n="invTableExpiry">过期日期</th>
                                    <th data-i18n="invTableStatus">状态</th>
                                    <th data-i18n="invTableStorage">存储位置</th>
                                    <th data-i18n="invTableActions">操作</th>
                                </tr>
                            </thead>
                            <tbody id="inventoryTableBody">
                                <tr>
                                    <td colspan="8" class="text-center" data-i18n="textLoading">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <nav>
                        <ul class="pagination justify-content-center" id="pagination"></ul>
                    </nav>
                </div>
            </main>
        </div>
    </div>

    <!-- 添加库存条目模态框 -->
    <div class="modal fade" id="inventoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="invModalTitleAdd">添加库存条目</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="inventoryForm">
                        <div class="mb-3">
                            <label class="form-label" for="donationId" data-i18n="invLabelDonationId">捐献记录ID *</label>
                            <input type="text" class="form-control" id="donationId" list="donationOptions" required
                                pattern="\d+">
                            <datalist id="donationOptions"></datalist>
                            <div class="form-text" data-i18n="invDonationHint">请关联一个已有的捐献记录</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="type" data-i18n="invLabelType">库存类型 *</label>
                            <select class="form-select" id="type" required>
                                <option value="" data-i18n="optionPleaseSelect">请选择</option>
                                <option value="WHOLE_BLOOD" data-i18n="invTypeWholeBlood">全血</option>
                                <option value="PLASMA" data-i18n="invTypePlasma">血浆</option>
                                <option value="PLATELETS" data-i18n="invTypePlatelets">血小板</option>
                                <option value="BONE_MARROW_SAMPLE" data-i18n="invTypeBoneMarrow">骨髓样本</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="bloodType" data-i18n="invLabelBloodGroup">血型 *</label>
                            <select class="form-select" id="bloodType" required>
                                <option value="" data-i18n="optionPleaseSelect">请选择</option>
                                <option value="I_POSITIVE">I+</option>
                                <option value="I_NEGATIVE">I-</option>
                                <option value="II_POSITIVE">II+</option>
                                <option value="II_NEGATIVE">II-</option>
                                <option value="III_POSITIVE">III+</option>
                                <option value="III_NEGATIVE">III-</option>
                                <option value="IV_POSITIVE">IV+</option>
                                <option value="IV_NEGATIVE">IV-</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="collectedAt" data-i18n="invLabelCollected">采集日期 *</label>
                            <input type="date" class="form-control" id="collectedAt" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="expiryDate" data-i18n="invLabelExpiry">过期日期 *</label>
                            <input type="date" class="form-control" id="expiryDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="storageLocation" data-i18n="invLabelStorage">存储位置</label>
                            <input type="text" class="form-control" id="storageLocation">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="comment" data-i18n="invLabelComment">备注</label>
                            <textarea class="form-control" id="comment" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                        data-i18n="labelCancel">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveInventory()"
                        data-i18n="labelSave">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 更新状态模态框 -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="invStatusModalTitle">更新库存状态</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="statusForm">
                        <input type="hidden" id="statusItemId">
                        <div class="mb-3">
                            <label class="form-label" for="status" data-i18n="invLabelStatus">状态 *</label>
                            <select class="form-select" id="status" required>
                                <option value="" data-i18n="optionPleaseSelect">请选择</option>
                                <option value="IN_STOCK" data-i18n="invStatusInStock">在库</option>
                                <option value="RESERVED" data-i18n="invStatusReserved">已预留</option>
                                <option value="USED" data-i18n="invStatusUsed">已使用</option>
                                <option value="EXPIRED" data-i18n="invStatusExpired">已过期</option>
                                <option value="DISCARDED" data-i18n="invStatusDiscarded">已废弃</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="statusFormComment" data-i18n="invLabelComment">备注</label>
                            <textarea class="form-control" id="statusFormComment" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                        data-i18n="labelCancel">取消</button>
                    <button type="button" class="btn btn-primary" onclick="updateStatus()"><span
                            data-i18n="invButtonUpdate">更新</span></button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/i18n.js}"></script>
    <script th:src="@{/js/dateUtils.js}"></script>
    <script>
        let currentPage = 0;
        const pageSize = 10;
        let donationsCache = [];

        $(document).ready(function () {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '/login'; return; }

            $('#currentUser').text(localStorage.getItem('username') || t('textUserPlaceholder'));
            $('#logoutBtn').on('click', function (e) {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                window.location.href = '/login';
            });

            loadInventory();
            loadDonationOptions();
            $('#searchBtn').on('click', function () { currentPage = 0; loadInventory(); });
            
            // 确保日期输入框初始化
            if (window.initDateInputs) {
                setTimeout(window.initDateInputs, 200);
            }
        });

        function loadInventory() {
            const token = localStorage.getItem('token');
            const bloodType = $('#bloodTypeFilter').val();
            const type = $('#typeFilter').val();
            const status = $('#statusFilter').val();
            const willExpireBefore = $('#expiryFilter').val();

            let url = `/api/inventory?page=${currentPage}&size=${pageSize}`;
            if (bloodType) url += `&bloodType=${bloodType}`;
            if (type) url += `&type=${type}`;
            if (status) url += `&status=${status}`;
            if (willExpireBefore) url += `&willExpireBefore=${willExpireBefore}`;

            $.ajax({
                url: url,
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function (response) {
                    if (response.success && response.data) {
                        displayInventory(response.data.content || []);
                        updatePagination(response.data.totalPages || 0);
                    }
                },
                error: function (xhr) {
                    let errorMsg = t('toastLoadFailed');
                    if (xhr && xhr.responseJSON) {
                        if (xhr.responseJSON.error && xhr.responseJSON.error.message) {
                            errorMsg = xhr.responseJSON.error.message;
                        } else if (xhr.responseJSON.error && typeof xhr.responseJSON.error === 'string') {
                            errorMsg = xhr.responseJSON.error;
                        } else if (xhr.responseJSON.message) {
                            errorMsg = xhr.responseJSON.message;
                        }
                    }
                    showToast('error', errorMsg);
                    $('#inventoryTableBody').html(`<tr><td colspan="8" class="text-center text-danger">${errorMsg}</td></tr>`);
                }
            });
        }

        function displayInventory(items) {
            if (items.length === 0) {
                $('#inventoryTableBody').html(`<tr><td colspan="8" class="text-center text-muted">${t('textNoData')}</td></tr>`);
                return;
            }

            let html = '';
            items.forEach(function (item) {
                const typeMap = {
                    'WHOLE_BLOOD': t('invTypeWholeBlood'),
                    'PLASMA': t('invTypePlasma'),
                    'PLATELETS': t('invTypePlatelets'),
                    'BONE_MARROW_SAMPLE': t('invTypeBoneMarrow')
                };
                const statusMap = {
                    'IN_STOCK': `<span class="badge bg-success">${t('invStatusInStock')}</span>`,
                    'RESERVED': `<span class="badge bg-info">${t('invStatusReserved')}</span>`,
                    'USED': `<span class="badge bg-primary">${t('invStatusUsed')}</span>`,
                    'EXPIRED': `<span class="badge bg-danger">${t('invStatusExpired')}</span>`,
                    'DISCARDED': `<span class="badge bg-secondary">${t('invStatusDiscarded')}</span>`
                };

                const expiryDate = item.expiryDate ? new Date(item.expiryDate) : null;
                let rowClass = '';
                if (expiryDate) {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    expiryDate.setHours(0, 0, 0, 0);
                    const daysUntilExpiry = Math.floor((expiryDate - today) / (1000 * 60 * 60 * 24));
                    if (item.status === 'EXPIRED' || daysUntilExpiry < 0) {
                        rowClass = 'expired';
                    } else if (daysUntilExpiry <= 7) {
                        rowClass = 'expiring';
                    }
                }

                // 血型显示映射
                const bloodTypeMap = {
                    'I_POSITIVE': 'I+',
                    'I_NEGATIVE': 'I-',
                    'II_POSITIVE': 'II+',
                    'II_NEGATIVE': 'II-',
                    'III_POSITIVE': 'III+',
                    'III_NEGATIVE': 'III-',
                    'IV_POSITIVE': 'IV+',
                    'IV_NEGATIVE': 'IV-'
                };
                const bloodType = item.bloodType ? bloodTypeMap[item.bloodType] || item.bloodType : t('textUnknown');

                html += `
                    <tr class="${rowClass}">
                        <td>${item.id || t('textUnknown')}</td>
                        <td>${typeMap[item.type] || t('textUnknown')}</td>
                        <td>${bloodType}</td>
                        <td>${DateUtils.formatDate(item.collectedAt)}</td>
                        <td>${DateUtils.formatDate(item.expiryDate)}</td>
                        <td>${statusMap[item.status] || t('textUnknown')}</td>
                        <td>${item.storageLocation || t('textUnknown')}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="openStatusModal(${item.id}, '${item.status}')" title="${t('invStatusModalTitle')}">✏️</button>
                            <button class="btn btn-sm btn-outline-info" onclick="viewInventory(${item.id})" title="${t('actionViewTitle')}">👁️</button>
                        </td>
                    </tr>
                `;
            });
            $('#inventoryTableBody').html(html);
        }

        function updatePagination(totalPages) {
            let html = '';
            for (let i = 0; i < totalPages; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i + 1}</a>
                </li>`;
            }
            $('#pagination').html(html);
        }

        function changePage(page) {
            currentPage = page;
            loadInventory();
        }

        function openAddModal() {
            $('#inventoryForm')[0].reset();
            const today = new Date().toISOString().split('T')[0];
            $('#collectedAt').val(today);
            $('#inventoryModal .modal-title').text(t('invModalTitleAdd'));
        }

        function openStatusModal(id, currentStatus) {
            $('#statusItemId').val(id);
            $('#statusForm #status').val(currentStatus);
            $('#statusFormComment').val('');
            $('#statusModal').modal('show');
        }

        function viewInventory(id) {
            const token = localStorage.getItem('token');
            $.ajax({
                url: `/api/inventory/${id}`,
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function (response) {
                    if (response.success && response.data) {
                        const item = response.data;
                        const typeMap = {
                            'WHOLE_BLOOD': t('invTypeWholeBlood'),
                            'PLASMA': t('invTypePlasma'),
                            'PLATELETS': t('invTypePlatelets'),
                            'BONE_MARROW_SAMPLE': t('invTypeBoneMarrow')
                        };
                        const statusMap = {
                            'IN_STOCK': t('invStatusInStock'),
                            'RESERVED': t('invStatusReserved'),
                            'USED': t('invStatusUsed'),
                            'EXPIRED': t('invStatusExpired'),
                            'DISCARDED': t('invStatusDiscarded')
                        };
                        // 血型显示映射
                        const bloodTypeMap = {
                            'I_POSITIVE': 'I+',
                            'I_NEGATIVE': 'I-',
                            'II_POSITIVE': 'II+',
                            'II_NEGATIVE': 'II-',
                            'III_POSITIVE': 'III+',
                            'III_NEGATIVE': 'III-',
                            'IV_POSITIVE': 'IV+',
                            'IV_NEGATIVE': 'IV-'
                        };
                        const bloodType = item.bloodType ? bloodTypeMap[item.bloodType] || item.bloodType : t('textUnknown');
                        const detail = `${t('invDetailTitle')}\n\n${t('invDetailType')}: ${typeMap[item.type] || t('textUnknown')}\n${t('invDetailBlood')}: ${bloodType}\n${t('invDetailCollected')}: ${DateUtils.formatDate(item.collectedAt)}\n${t('invDetailExpiry')}: ${DateUtils.formatDate(item.expiryDate)}\n${t('invDetailStatus')}: ${statusMap[item.status] || t('textUnknown')}\n${t('invDetailLocation')}: ${item.storageLocation || t('textUnknown')}\n${t('invDetailComment')}: ${item.comment || t('textUnknown')}`;
                        alert(detail);
                    }
                },
                error: function (xhr) {
                    let errorMsg = t('toastLoadDetailFailed');
                    if (xhr && xhr.responseJSON) {
                        if (xhr.responseJSON.error && xhr.responseJSON.error.message) {
                            errorMsg = xhr.responseJSON.error.message;
                        } else if (xhr.responseJSON.error && typeof xhr.responseJSON.error === 'string') {
                            errorMsg = xhr.responseJSON.error;
                        } else if (xhr.responseJSON.message) {
                            errorMsg = xhr.responseJSON.message;
                        }
                    }
                    showToast('error', errorMsg);
                }
            });
        }

        function saveInventory() {
            if (!$('#inventoryForm')[0].checkValidity()) {
                $('#inventoryForm')[0].reportValidity();
                return;
            }

            const token = localStorage.getItem('token');
            const donationIdRaw = $('#donationId').val().trim();
            if (!/^\d+$/.test(donationIdRaw)) {
                showToast('error', t('invToastInvalidDonationId'));
                return;
            }
            const matchedDonation = donationsCache.find(d => String(d.id) === donationIdRaw);
            if (!matchedDonation) {
                showToast('error', t('invToastInvalidDonationId'));
                return;
            }
            const data = {
                donationId: parseInt(donationIdRaw, 10),
                type: $('#type').val(),
                bloodType: $('#bloodType').val(),
                collectedAt: $('#collectedAt').val(),
                expiryDate: $('#expiryDate').val(),
                storageLocation: $('#storageLocation').val() || null,
                comment: $('#comment').val() || null
            };

            $.ajax({
                url: '/api/inventory',
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                data: JSON.stringify(data),
                success: function (response) {
                    $('#inventoryModal').modal('hide');
                    loadInventory();
                    showToast('success', t('toastSaveSuccess'));
                },
                error: function (xhr) {
                    let errorMsg = t('toastSaveFailed');
                    if (xhr && xhr.responseJSON) {
                        if (xhr.responseJSON.error && xhr.responseJSON.error.message) {
                            errorMsg = xhr.responseJSON.error.message;
                        } else if (xhr.responseJSON.error && typeof xhr.responseJSON.error === 'string') {
                            errorMsg = xhr.responseJSON.error;
                        } else if (xhr.responseJSON.message) {
                            errorMsg = xhr.responseJSON.message;
                        }
                    }
                    showToast('error', errorMsg);
                }
            });
        }

        function updateStatus() {
            if (!$('#statusForm')[0].checkValidity()) {
                $('#statusForm')[0].reportValidity();
                return;
            }

            const token = localStorage.getItem('token');
            const id = $('#statusItemId').val();
            const data = {
                status: $('#statusForm #status').val(),
                comment: $('#statusFormComment').val() || null
            };

            $.ajax({
                url: `/api/inventory/${id}/status`,
                method: 'PATCH',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                data: JSON.stringify(data),
                success: function (response) {
                    $('#statusModal').modal('hide');
                    loadInventory();
                    showToast('success', t('toastSaveSuccess'));
                },
                error: function (xhr) {
                    let errorMsg = t('toastSaveFailed');
                    if (xhr && xhr.responseJSON) {
                        if (xhr.responseJSON.error && xhr.responseJSON.error.message) {
                            errorMsg = xhr.responseJSON.error.message;
                        } else if (xhr.responseJSON.error && typeof xhr.responseJSON.error === 'string') {
                            errorMsg = xhr.responseJSON.error;
                        } else if (xhr.responseJSON.message) {
                            errorMsg = xhr.responseJSON.message;
                        }
                    }
                    showToast('error', errorMsg);
                }
            });
        }

        function showToast(type, message) {
            const bgColor = type === 'success' ? 'bg-success' : 'bg-danger';
            const toastHtml = `
                <div class="toast align-items-center text-white ${bgColor} border-0" role="alert" style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
                    <div class="d-flex">
                        <div class="toast-body">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;
            $('body').append(toastHtml);
            const toast = new bootstrap.Toast($('.toast').last()[0]);
            toast.show();
            setTimeout(() => $('.toast').last().remove(), 3000);
        }

        function loadDonationOptions() {
            const token = localStorage.getItem('token');
            $.ajax({
                url: '/api/donations?page=0&size=200',
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function (response) {
                    if (response.success && response.data) {
                        donationsCache = response.data.content || [];
                        renderDonationOptions();
                    }
                },
                error: function (xhr) {
                    console.warn('加载捐献记录列表失败', xhr.status);
                }
            });
        }

        function renderDonationOptions() {
            const optionsHtml = donationsCache
                .map(item => {
                    const donorName = item.donorName || `ID: ${item.donorId}`;
                    return `<option value="${item.id}">${donorName} (ID: ${item.id})</option>`;
                })
                .join('');
            $('#donationOptions').html(optionsHtml);
        }

        function extractErrorMessage(xhr, fallback) {
            if (xhr && xhr.responseJSON) {
                const resp = xhr.responseJSON;
                if (typeof resp === 'string') {
                    return resp;
                }
                if (resp.error && resp.error.message) {
                    return resp.error.message;
                }
                if (resp.message) {
                    return resp.message;
                }
            }
            return fallback;
        }
    </script>
</body>

</html>
