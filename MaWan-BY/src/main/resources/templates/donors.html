<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titleDonors">捐献者管理 - 血液与骨髓捐献管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard" data-i18n="brand">🩸 捐献管理系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item dropdown language-switcher me-2">
                        <button class="btn btn-light btn-sm dropdown-toggle" id="languageDropdown" data-bs-toggle="dropdown">
                            🌐 <span data-i18n="langLabel" data-current-lang-label>中文</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item lang-option" data-lang="zh" data-i18n="langChinese">中文</a></li>
                            <li><a class="dropdown-item lang-option" data-lang="en" data-i18n="langEnglish">英文</a></li>
                            <li><a class="dropdown-item lang-option" data-lang="ru" data-i18n="langRussian">俄语</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <span id="currentUser">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn" data-i18n="logout">退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/dashboard" data-i18n="navDashboard">📊 仪表板</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/donors" data-i18n="navDonors">👥 捐献者管理</a></li>
                        <li class="nav-item"><a class="nav-link" href="/medical-checks" data-i18n="navMedicalChecks">🏥 体检记录</a></li>
                        <li class="nav-item"><a class="nav-link" href="/donations" data-i18n="navDonations">💉 捐献记录</a></li>
                        <li class="nav-item"><a class="nav-link" href="/inventory" data-i18n="navInventory">📦 库存管理</a></li>
                        <li class="nav-item"><a class="nav-link" href="/appointments" data-i18n="navAppointments">📅 预约管理</a></li>
                        <li class="nav-item"><a class="nav-link" href="/reports" data-i18n="navReports">📈 统计报表</a></li>
                        <li class="nav-item"><a class="nav-link" href="/users" data-i18n="navUsers">⚙️ 用户管理</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="pt-3 pb-2 mb-3 border-bottom">
                    <h2 data-i18n="headingDonors">捐献者管理</h2>
                </div>

                <div class="content-card mb-4">
                    <div class="page-toolbar">
                        <div class="filter-grid">
                            <div>
                                <input type="text" class="form-control" id="searchInput" placeholder="搜索姓名或身份证号..." data-i18n-placeholder="donorSearchPlaceholder">
                            </div>
                            <div>
                                <select class="form-select" id="bloodTypeFilter">
                                    <option value="" data-i18n="optionAllBloodTypes">全部血型</option>
                                    <option value="I_POSITIVE">I+</option>
                                    <option value="I_NEGATIVE">I-</option>
                                    <option value="II_POSITIVE">II+</option>
                                    <option value="II_NEGATIVE">II-</option>
                                    <option value="III_POSITIVE">III+</option>
                                    <option value="III_NEGATIVE">III-</option>
                                    <option value="IV_POSITIVE">IV+</option>
                                    <option value="IV_NEGATIVE">IV-</option>
                                </select>
                            </div>
                            <div>
                                <select class="form-select" id="statusFilter">
                                    <option value="" data-i18n="optionAllStatus">全部状态</option>
                                    <option value="ACTIVE" data-i18n="optionStatusActive">活跃</option>
                                    <option value="INACTIVE" data-i18n="optionStatusInactive">非活跃</option>
                                </select>
                            </div>
                        </div>
                        <div class="action-row">
                            <button class="btn btn-outline-primary" type="button" id="searchBtn">
                                <span class="me-1">🔍</span><span data-i18n="buttonSearch">搜索</span>
                            </button>
                            <button class="btn btn-primary add-record-btn" data-bs-toggle="modal" data-bs-target="#donorModal" onclick="openAddModal()">
                                <span class="icon-dot">＋</span>
                                <span class="label" data-i18n="buttonAddDonor">添加</span>
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th data-i18n="thName">姓名</th>
                                    <th data-i18n="thGender">性别</th>
                                    <th data-i18n="thBloodType">血型</th>
                                    <th data-i18n="thPhone">联系电话</th>
                                    <th data-i18n="thIdNumber">身份证号</th>
                                    <th data-i18n="thBirthDate">出生日期</th>
                                    <th data-i18n="thStatus">状态</th>
                                    <th data-i18n="thActions">操作</th>
                                </tr>
                            </thead>
                            <tbody id="donorTableBody">
                                <tr><td colspan="8" class="text-center" data-i18n="textLoading">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <nav>
                        <ul class="pagination justify-content-center" id="pagination"></ul>
                    </nav>
                </div>
            </main>
        </div>
    </div>

    <!-- 捐献者详情模态框 -->
    <div class="modal fade" id="donorDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="modalDonorDetail">捐献者详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="donorDetailBody">
                    <!-- 详情内容动态加载 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="labelClose">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑捐献者模态框 -->
    <div class="modal fade" id="donorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle" data-i18n="modalAddDonor">添加捐献者</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="donorForm">
                        <input type="hidden" id="donorId">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="labelFullName">姓名 *</label>
                            <input type="text" class="form-control" id="fullName" required 
                                   placeholder="请输入姓名（支持中文和英文）">
                            <div class="form-text" data-i18n="hintFullName">中文姓名可直接输入，例如“张三”；系统会自动拆分姓与名。</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="labelGender">性别 *</label>
                            <select class="form-select" id="gender" required>
                                <option value="" data-i18n="optionPleaseSelect">请选择</option>
                                <option value="MALE" data-i18n="genderMale">男</option>
                                <option value="FEMALE" data-i18n="genderFemale">女</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="labelBloodType">血型 *</label>
                            <select class="form-select" id="bloodType" required>
                                <option value="" data-i18n="optionPleaseSelect">请选择</option>
                                <option value="I_POSITIVE">I+</option>
                                <option value="I_NEGATIVE">I-</option>
                                <option value="II_POSITIVE">II+</option>
                                <option value="II_NEGATIVE">II-</option>
                                <option value="III_POSITIVE">III+</option>
                                <option value="III_NEGATIVE">III-</option>
                                <option value="IV_POSITIVE">IV+</option>
                                <option value="IV_NEGATIVE">IV-</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="labelPhone">联系电话 *</label>
                            <input type="tel" class="form-control" id="phoneNumber" required pattern="[0-9]{11}" 
                                   placeholder="11位手机号码">
                            <div class="form-text" data-i18n="hintPhone">请输入11位手机号码</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="labelIdNumber">身份证号 *</label>
                            <input type="text" class="form-control" id="idNumber" required
                                   pattern="[0-9]{8,14}" placeholder="8-14位ID">
                            <div class="form-text" data-i18n="hintIdNumber">请输入18位身份证号码</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="labelEmail">邮箱</label>
                            <input type="email" class="form-control" id="email" placeholder="example@email.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="labelBirthDate">出生日期 *</label>
                            <input type="date" class="form-control" id="dateOfBirth" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="labelAddress">地址</label>
                            <textarea class="form-control" id="address" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="labelCancel">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveDonor()" data-i18n="labelSave">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/i18n.js}"></script>
    <script th:src="@{/js/dateUtils.js}"></script>
    <script>
        let currentPage = 0;
        const pageSize = 10;

        $(document).ready(function() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '/login'; return; }
            
            $('#currentUser').text(localStorage.getItem('username') || t('textUserPlaceholder'));
            $('#logoutBtn').on('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                window.location.href = '/login';
            });
            
            loadDonors();
            $('#searchBtn').on('click', function() { currentPage = 0; loadDonors(); });
            $('#searchInput').on('keypress', function(e) { if(e.which === 13) { currentPage = 0; loadDonors(); } });
            $('#bloodTypeFilter, #statusFilter').on('change', function() { currentPage = 0; loadDonors(); });
            
            // 确保日期输入框初始化
            if (window.initDateInputs) {
                setTimeout(window.initDateInputs, 200);
            }
        });

        function loadDonors() {
            const token = localStorage.getItem('token');
            const name = $('#searchInput').val();
            const bloodType = $('#bloodTypeFilter').val();
            const statusFilter = $('#statusFilter').val();

            let url = `/api/donors?page=${currentPage}&size=${pageSize}`;
            if (name) url += `&name=${encodeURIComponent(name)}`;
            if (bloodType) url += `&bloodType=${bloodType}`;

            $.ajax({
                url: url,
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function(response) {
                    if (response.success && response.data) {
                        let donors = response.data.content || [];
                        // 客户端状态筛选
                        if (statusFilter) {
                            donors = donors.filter(d => {
                                const isActive = d.active !== false;
                                return statusFilter === 'ACTIVE' ? isActive : !isActive;
                            });
                        }
                        displayDonors(donors);
                        updatePagination(response.data.totalPages || 0);
                    }
                },
                error: function(xhr) {
                    let errorMsg = t('toastLoadFailed');
                    if (xhr.responseJSON) {
                        if (xhr.responseJSON.error && xhr.responseJSON.error.message) {
                            errorMsg = xhr.responseJSON.error.message;
                        } else if (xhr.responseJSON.error && typeof xhr.responseJSON.error === 'string') {
                            errorMsg = xhr.responseJSON.error;
                        } else if (xhr.responseJSON.message) {
                            errorMsg = xhr.responseJSON.message;
                        }
                    }
                    showToast('error', errorMsg);
                    $('#donorTableBody').html(`<tr><td colspan="8" class="text-center text-danger">${errorMsg}</td></tr>`);
                }
            });
        }

        function displayDonors(donors) {
            if (donors.length === 0) {
                $('#donorTableBody').html(`<tr><td colspan="8" class="text-center text-muted">${t('textNoData')}</td></tr>`);
                return;
            }

            let html = '';
            donors.forEach(function(donor) {
                const fullName = [donor.firstName, donor.lastName].filter(Boolean).join(' ');
                const status = donor.active !== false
                    ? `<span class="badge bg-success">${t('statusActiveLabel')}</span>`
                    : `<span class="badge bg-secondary">${t('statusInactiveLabel')}</span>`;
                const gender = donor.gender === 'MALE'
                    ? t('genderMale')
                    : (donor.gender === 'FEMALE' ? t('genderFemale') : t('textUnknown'));

                // 血型显示映射
                const bloodTypeMap = {
                    'I_POSITIVE': 'I+',
                    'I_NEGATIVE': 'I-',
                    'II_POSITIVE': 'II+',
                    'II_NEGATIVE': 'II-',
                    'III_POSITIVE': 'III+',
                    'III_NEGATIVE': 'III-',
                    'IV_POSITIVE': 'IV+',
                    'IV_NEGATIVE': 'IV-'
                };
                const bloodType = donor.bloodType ? bloodTypeMap[donor.bloodType] || donor.bloodType : t('textUnknown');

                const dateOfBirth = DateUtils.formatDate(donor.dateOfBirth);
                const phone = donor.phone || t('textUnknown');
                const passport = donor.passportNumber || t('textUnknown');
                const unknown = t('textUnknown');

                html += `
                    <tr>
                        <td><strong>${fullName || unknown}</strong></td>
                        <td>${gender}</td>
                        <td>${bloodType}</td>
                        <td>${phone}</td>
                        <td>${passport}</td>
                        <td>${dateOfBirth}</td>
                        <td>${status}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-info" onclick="viewDonor(${donor.id})" title="${t('actionViewTitle')}">
                                👁️
                            </button>
                            <button class="btn btn-sm btn-outline-primary" onclick="editDonor(${donor.id})" title="${t('actionEditTitle')}">
                                ✏️
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteDonor(${donor.id})" title="${t('actionDeleteTitle')}">
                                🗑️
                            </button>
                        </td>
                    </tr>
                `;
            });
            $('#donorTableBody').html(html);
        }

        function updatePagination(totalPages) {
            let html = '';
            for (let i = 0; i < totalPages; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i + 1}</a>
                </li>`;
            }
            $('#pagination').html(html);
        }

        function changePage(page) {
            currentPage = page;
            loadDonors();
        }

        function openAddModal() {
            $('#modalTitle').text(t('modalAddDonor'));
            $('#donorForm')[0].reset();
            $('#donorId').val('');
        }

        function viewDonor(id) {
            const token = localStorage.getItem('token');
            $.ajax({
                url: `/api/donors/${id}`,
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function(response) {
                    if (response.success && response.data) {
                        const donor = response.data;
                        const fullName = [donor.firstName, donor.lastName].filter(Boolean).join(' ') || t('textUnknown');
                        const gender = donor.gender === 'MALE'
                            ? t('genderMale')
                            : (donor.gender === 'FEMALE' ? t('genderFemale') : t('textUnknown'));

                        // 血型显示映射
                        const bloodTypeMap = {
                            'I_POSITIVE': 'I+',
                            'I_NEGATIVE': 'I-',
                            'II_POSITIVE': 'II+',
                            'II_NEGATIVE': 'II-',
                            'III_POSITIVE': 'III+',
                            'III_NEGATIVE': 'III-',
                            'IV_POSITIVE': 'IV+',
                            'IV_NEGATIVE': 'IV-'
                        };
                        const bloodType = donor.bloodType ? bloodTypeMap[donor.bloodType] || donor.bloodType : t('textUnknown');

                        const phone = donor.phone || t('textUnknown');
                        const passport = donor.passportNumber || t('textUnknown');
                        const email = donor.email || t('textUnknown');
                        const dob = DateUtils.formatDate(donor.dateOfBirth);
                        const status = donor.active !== false
                            ? `<span class="badge bg-success">${t('statusActiveLabel')}</span>`
                            : `<span class="badge bg-secondary">${t('statusInactiveLabel')}</span>`;
                        const address = donor.address || t('textUnknown');
                        const hla = donor.hlaType ? `<div class="col-12"><strong>${t('detailHla')}:</strong> ${donor.hlaType}</div>` : '';
                        let detailHtml = `
                            <div class="row">
                                <div class="col-md-6"><strong>${t('detailName')}:</strong> ${fullName}</div>
                                <div class="col-md-6"><strong>${t('detailGender')}:</strong> ${gender}</div>
                                <div class="col-md-6"><strong>${t('detailBloodType')}:</strong> ${bloodType}</div>
                                <div class="col-md-6"><strong>${t('detailPhone')}:</strong> ${phone}</div>
                                <div class="col-md-6"><strong>${t('detailIdNumber')}:</strong> ${passport}</div>
                                <div class="col-md-6"><strong>${t('detailEmail')}:</strong> ${email}</div>
                                <div class="col-md-6"><strong>${t('detailBirthDate')}:</strong> ${dob}</div>
                                <div class="col-md-6"><strong>${t('detailStatus')}:</strong> ${status}</div>
                                <div class="col-12"><strong>${t('detailAddress')}:</strong> ${address}</div>
                                ${hla}
                            </div>
                        `;
                        $('#donorDetailBody').html(detailHtml);
                        $('#donorDetailModal').modal('show');
                    }
                },
                error: function() {
                    showToast('error', t('toastLoadDetailFailed'));
                }
            });
        }

        function editDonor(id) {
            const token = localStorage.getItem('token');
            $.ajax({
                url: `/api/donors/${id}`,
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function(response) {
                    if (response.success && response.data) {
                        const donor = response.data;
                        $('#modalTitle').text(t('modalEditDonor'));
                        $('#donorId').val(donor.id);
                        const displayName = [donor.firstName, donor.lastName].filter(Boolean).join(' ');
                        $('#fullName').val(displayName.trim());
                        $('#gender').val(donor.gender);
                        $('#bloodType').val(donor.bloodType);
                        $('#phoneNumber').val(donor.phone);
                        $('#idNumber').val(donor.passportNumber);
                        $('#email').val(donor.email || '');
                        const dobValue = donor.dateOfBirth ? donor.dateOfBirth.split('T')[0] : '';
                        $('#dateOfBirth').val(dobValue);
                        $('#address').val(donor.address || '');
                        $('#donorModal').modal('show');
                    }
                },
                error: function() {
                    showToast('error', t('toastLoadDataFailed'));
                }
            });
        }

        function saveDonor() {
            if (!$('#donorForm')[0].checkValidity()) {
                $('#donorForm')[0].reportValidity();
                return;
            }

            const token = localStorage.getItem('token');
            const id = $('#donorId').val();
            const fullNameInput = $('#fullName').val().trim();
            if (!fullNameInput) {
                showToast('error', t('toastInputName'));
                return;
            }
            const normalizedName = fullNameInput.replace(/\s+/g, ' ').trim();
            let firstName = '';
            let lastName = '';
            const nameParts = normalizedName.split(' ');
            if (nameParts.length > 1) {
                firstName = nameParts[0];
                lastName = nameParts.slice(1).join(' ');
            } else if (normalizedName.length >= 2) {
                firstName = normalizedName.slice(0, 1);
                lastName = normalizedName.slice(1);
            } else {
                firstName = normalizedName;
                lastName = normalizedName;
            }

            const data = {
                firstName: firstName,
                lastName: lastName,
                gender: $('#gender').val(),
                bloodType: $('#bloodType').val(),
                phone: $('#phoneNumber').val(),
                passportNumber: $('#idNumber').val(),
                email: $('#email').val() || null,
                dateOfBirth: $('#dateOfBirth').val(),
                address: $('#address').val() || null
            };

            const url = id ? `/api/donors/${id}` : '/api/donors';
            const method = id ? 'PUT' : 'POST';

            $.ajax({
                url: url,
                method: method,
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                data: JSON.stringify(data),
                success: function(response) {
                    $('#donorModal').modal('hide');
                    loadDonors();
                    showToast('success', t('toastSaveSuccess'));
                },
                error: function(xhr) {
                    const errorMsg = (xhr.responseJSON && xhr.responseJSON.error) || t('toastSaveFailed');
                    showToast('error', errorMsg);
                }
            });
        }

        function deleteDonor(id) {
            if (!confirm(t('confirmDeleteDonor'))) return;
            
            const token = localStorage.getItem('token');
            $.ajax({
                url: `/api/donors/${id}`,
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function() {
                    loadDonors();
                    showToast('success', t('toastDeleteSuccess'));
                },
                error: function(xhr) {
                    const errorMsg = (xhr.responseJSON && xhr.responseJSON.error) || t('toastDeleteFailed');
                    showToast('error', errorMsg);
                }
            });
        }
        
        function showToast(type, message) {
            const bgColor = type === 'success' ? 'bg-success' : 'bg-danger';
            const toastHtml = `
                <div class="toast align-items-center text-white ${bgColor} border-0" role="alert" style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
                    <div class="d-flex">
                        <div class="toast-body">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;
            $('body').append(toastHtml);
            const toast = new bootstrap.Toast($('.toast').last()[0]);
            toast.show();
            setTimeout(() => $('.toast').last().remove(), 3000);
        }
    </script>
</body>
</html>
