spring:
  application:
    name: donor-management
  profiles:
    default: dev

  datasource:
    url: jdbc:mysql://localhost:3306/donor_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      encoding: UTF-8

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8081
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: YourSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512Algorithm
  expiration: 86400000  # 24 hours in milliseconds

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging Configuration
logging:
  level:
    com.example.donormanagement: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
